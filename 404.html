    /><script id="recipe-book-bootstrap">async function recoverLegacyNavigation(scope) {
  const index = new URL('index.html', scope).href;
  let restored = false;
  for (const name of await caches.keys()) {
    if (!/^recipe-book-shell-\d{8}-\d+$/.test(name)) continue;
    const cache = await caches.open(name);
    const original = await cache.match(scope);
    const current = await cache.match(index);
    if (!original || !current) continue;
    const oldText = await original.text();
    const newText = await current.text();
    const legacyEntry = /<script\b[^>]*\bsrc=["'](?:\.\/)?js\/app\.js(?:\?[^"']*)?["']/i;
    if (!legacyEntry.test(oldText) || oldText.includes('name="recipe-book-release"') || !newText.includes('name="recipe-book-release"')) continue;
    const notice = '<section id="recipe-book-upgrade-recovery" role="alert"><h2>Previous offline version</h2><p>The update could not finish. Reconnect and reload to complete it. If you used the newer app, this older version cannot show or save those newer changes. Your saved data is retained; keep this browser\'s site data.</p></section>';
    const recovered = oldText.replace(/<body\b[^>]*>/i, (body) => body + notice);
    if (recovered === oldText) continue;
    await cache.put(index, new Response(recovered, {headers: {'Content-Type': 'text/html; charset=utf-8'}}));
    restored = true;
  }
  return restored;
}

(() => {
  if (!('caches' in globalThis) || !navigator.serviceWorker?.controller) return;
  const scope = new URL("/recipe-book/", location.origin).href;
  const recovery = navigator.serviceWorker.getRegistration(scope)
    .then((registration) => registration?.scope === scope ? recoverLegacyNavigation(scope) : false)
    .catch(() => false);
  // Only an unavailable entry module can trigger this recovery reload. No new
  // application state exists yet, and later dynamic imports never match it.
  window.addEventListener('error', (event) => {
    if (!event.target?.hasAttribute?.('data-recipe-book-entry')) return;
    void recovery.then((restored) => {
      if (restored && !navigator.onLine) { location.reload(); return; }
      const root = document.getElementById('root');
      if (!root || root.childNodes.length) return;
      const panel = document.createElement('section');
      panel.setAttribute('role', 'alert');
      const title = document.createElement('h1'); title.textContent = 'The update could not finish loading';
      const detail = document.createElement('p');
      detail.textContent = restored
        ? 'Your previous offline version is available. Reconnect and reload to finish the update. Keep this browser’s site data to retain your saved changes.'
        : 'Reconnect and reload to try again. Keep this browser’s site data to retain your saved changes.';
      const retry = document.createElement('button'); retry.type = 'button'; retry.textContent = 'Reload';
      retry.addEventListener('click', () => location.reload());
      panel.append(title, detail, retry); root.append(panel);
    });
  }, true);
})();
