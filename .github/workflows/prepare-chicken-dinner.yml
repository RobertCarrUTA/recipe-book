name: Prepare chicken dinner data

on:
  push:
    branches:
      - feat/smoky-lemon-chicken-dinner
    paths:
      - .github/workflows/prepare-chicken-dinner.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/smoky-lemon-chicken-dinner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/smoky-lemon-chicken-dinner
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate recipe data
        run: |
          npm run build:recipes
          npm run update:normalization-snapshot
          npm run report:data-quality
      - name: Run repository verification
        run: npm run verify
      - name: Match the locally reviewed output and commit only recipe data
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object data/recipes/smoky-lemon-chicken-with-brown-rice.json)" = 967877aafa5635284e0dc96e16945fd5a2c07f0d
          test "$(git hash-object data/recipes.json)" = 1fc335c7189e0d12620b5425165f6849b5488c7f
          test "$(git hash-object tests/fixtures/normalization_catalog_snapshot.json)" = 4df02c67dbfb5523f4671a03a9b6f190daf06135
          git diff --check
          git add -- data/recipes.json tests/fixtures/normalization_catalog_snapshot.json
          git rm -- .github/workflows/prepare-chicken-dinner.yml
          test "$(git write-tree)" = 030ae42bbaca23cdeaa169ae097b0a12106f39c3
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build and verify chicken dinner data; remove temporary build workflow'
          git push origin HEAD:refs/heads/feat/smoky-lemon-chicken-dinner
