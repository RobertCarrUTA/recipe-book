name: Prepare spicy beef hot dog recipe

on:
  push:
    branches:
      - recipes/spicy-beef-hot-dogs
    paths:
      - .github/workflows/prepare-spicy-beef-hot-dogs.yml

permissions:
  contents: write

concurrency:
  group: prepare-spicy-beef-hot-dogs
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'RobertCarrUTA/recipe-book' && github.ref == 'refs/heads/recipes/spicy-beef-hot-dogs'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Preserve specific shopping labels and test the parsed grocery path
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/normalization_rules.js)" = "5ed779e3790417bd139fa3aed68a971631132ef8"
          test "$(git hash-object tests/grocery_ingredient_parser.test.mjs)" = "e68ce8b2cc1ff0d57c72c538ad7af18731a4b354"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { parseStructuredGroceryIngredient } from "./js/grocery_ingredient_parser.js";

          assert.equal(parseStructuredGroceryIngredient({ item: "potato hot dog buns", quantity: 4, unit: "item" }).canonical.base, "potato");
          function replaceOnce(path, anchor, replacement) {
            const source = fs.readFileSync(path, "utf8");
            assert.equal(source.split(anchor).length, 2, `Expected one anchor in ${path}`);
            fs.writeFileSync(path, source.replace(anchor, replacement));
          }
          const bunAnchor = '  { includesAll: ["potato bun", "brioche bun"], base: "potato bun or brioche bun" },';
          replaceOnce("js/normalization_rules.js", bunAnchor, '  { includes: "potato hot dog bun", base: "potato hot dog buns" },\n' + bunAnchor);
          const pickleAnchor = '  { includesAny: ["pickle chips", "pickles"], base: "pickles" },';
          replaceOnce("js/normalization_rules.js", pickleAnchor, '  { includes: "dill pickles", base: "dill pickles" },\n' + pickleAnchor);
          const importAnchor = 'import { test } from "./test_helpers.mjs";';
          replaceOnce("tests/grocery_ingredient_parser.test.mjs", importAnchor, 'import { determineGroupForKey } from "../js/grouping.js";\n' + importAnchor);
          const regression = [
            '',
            'test("parsed hot dog ingredients preserve shopping labels and groups", () => {',
            '  const cases = [',
            '    ["all-beef hot dogs", "all-beef hot dogs", "Meat"],',
            '    ["potato hot dog buns", "potato hot dog buns", "Pantry"],',
            '    ["dill pickles", "dill pickles", "Sauces, Marinades, & Condiments"],',
            '    ["pickled jalapenos", "pickled jalapenos", "Sauces, Marinades, & Condiments"],',
            '    ["potatoes", "potato", "Vegetables"],',
            '    ["dill pickle chips", "dill pickle chips", "Sauces, Marinades, & Condiments"],',
            '    ["pickles", "pickles", "Sauces, Marinades, & Condiments"],',
            '  ];',
            '',
            '  cases.forEach(([item, expectedLabel, expectedGroup]) => {',
            '    const parsed = parseStructuredGroceryIngredient({ item, quantity: 2, unit: "item" });',
            '    assert.equal(parsed.canonical.base, expectedLabel, item);',
            '    assert.equal(parsed.canonical.display, expectedLabel, item);',
            '    assert.equal(parsed.unitKey, "item", item);',
            '    assert.deepEqual(parsed.quantityRange, { min: 2, max: 2 }, item);',
            '    assert.equal(determineGroupForKey(parsed.canonical.base), expectedGroup, item);',
            '  });',
            '});',
            '',
          ].join("\n");
          fs.appendFileSync("tests/grocery_ingredient_parser.test.mjs", regression);
          NODE

      - name: Rebuild the recipe bundle and reviewed grocery snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object data/recipes/spicy-beef-hot-dogs.json)" = "512d8e12a5c38ecac7cbf60f63fe6981607011ad"
          npm run build:recipes
          npm run update:normalization-snapshot
          npm run set-asset-version -- 20260907-2
          npm run report:data-quality

      - name: Preserve the approved recipe and every existing recipe
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import childProcess from "node:child_process";
          import fs from "node:fs";

          const source = JSON.parse(fs.readFileSync("data/recipes/spicy-beef-hot-dogs.json", "utf8"));
          const baseline = JSON.parse(childProcess.execFileSync("git", ["show", "origin/main:data/recipes.json"], { encoding: "utf8" }));
          const bundle = JSON.parse(fs.readFileSync("data/recipes.json", "utf8"));
          assert.equal(source.author, "Robert Carr");
          assert.equal(source.instructions.length, 7);
          assert.equal(bundle.length, baseline.length + 1);
          assert.deepEqual(bundle.filter((recipe) => recipe.id !== source.id), baseline);
          assert.deepEqual(bundle.find((recipe) => recipe.id === source.id), source);
          const changed = childProcess.execFileSync("git", ["diff", "--name-only"], { encoding: "utf8" }).trim().split("\n").filter(Boolean);
          const allowed = new Set(["js/normalization_rules.js", "tests/grocery_ingredient_parser.test.mjs", "tests/fixtures/normalization_catalog_snapshot.json", "data/recipes.json", "index.html", "404.html", "sw.js"]);
          assert.ok(changed.every((path) => allowed.has(path)), `Unexpected changes: ${changed.join(", ")}`);
          console.log(`Verified ${baseline.length} unchanged recipes and the approved new recipe.`);
          NODE

      - name: Run core verification
        run: npm run verify

      - name: Show changes for final review
        run: |
          git diff --stat
          git diff -- js/normalization_rules.js tests/grocery_ingredient_parser.test.mjs tests/fixtures/normalization_catalog_snapshot.json index.html 404.html sw.js

      - name: Commit verified changes to the recipe branch
        shell: bash
        run: |
          set -euo pipefail
          git add js/normalization_rules.js tests/grocery_ingredient_parser.test.mjs tests/fixtures/normalization_catalog_snapshot.json data/recipes.json index.html 404.html sw.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve hot dog bun and dill pickle grocery identities"
          git push origin HEAD:refs/heads/recipes/spicy-beef-hot-dogs
