name: Prepare spicy beef hot dog recipe

on:
  push:
    branches:
      - recipes/spicy-beef-hot-dogs
    paths:
      - .github/workflows/prepare-spicy-beef-hot-dogs.yml

permissions:
  contents: write

concurrency:
  group: prepare-spicy-beef-hot-dogs
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'RobertCarrUTA/recipe-book' && github.ref == 'refs/heads/recipes/spicy-beef-hot-dogs'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify the existing main baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="${RUNNER_TEMP}/recipe-book-baseline"
          git worktree add --detach "$baseline" origin/main
          cd "$baseline"
          npm ci
          npm run verify

      - name: Install locked dependencies
        run: npm ci

      - name: Classify hot dog buns and pickled jalapenos with regression coverage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object js/grouping.js)" = "f18c9496bc324b1cbd1624ac060b36d3fdfd942f"
          test "$(git hash-object tests/grouping.test.mjs)" = "0f623f611f72ca0865271e5d041b85a0f463757e"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";

          function replaceOnce(path, anchor, replacement) {
            const source = fs.readFileSync(path, "utf8");
            assert.equal(source.split(anchor).length, 2, `Expected one anchor in ${path}`);
            fs.writeFileSync(path, source.replace(anchor, replacement));
          }

          replaceOnce("js/grouping.js", '  honey: "Pantry",\n', '  honey: "Pantry",\n  "hot dog buns": "Pantry",\n');
          replaceOnce("js/grouping.js", '  "pickled hot cherry peppers": "Sauces, Marinades, & Condiments",\n', '  "pickled hot cherry peppers": "Sauces, Marinades, & Condiments",\n  "pickled jalapenos": "Sauces, Marinades, & Condiments",\n');
          const regression = [
            'test("hot dog grocery labels use the correct shopping groups", () => {',
            '  const cases = [',
            '    ["all-beef hot dogs", "Meat"],',
            '    ["hot dog buns", "Pantry"],',
            '    ["potato hot dog buns", "Pantry"],',
            '    ["pickled jalapenos", "Sauces, Marinades, & Condiments"],',
            '    ["sliced pickled jalapenos", "Sauces, Marinades, & Condiments"],',
            '    ["jalapeno", "Vegetables"],',
            '    ["potato", "Vegetables"],',
            '  ];',
            '',
            '  cases.forEach(([key, expected]) => {',
            '    assert.equal(determineGroupForKey(key), expected, key);',
            '  });',
            '});',
            '',
            '',
          ].join("\n");
          const anchor = 'test("sortGroceryGroups uses shopping flow order and keeps Other last", () => {';
          replaceOnce("tests/grouping.test.mjs", anchor, regression + anchor);
          NODE

      - name: Build recipe data and synchronize the asset version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object data/recipes/spicy-beef-hot-dogs.json)" = "512d8e12a5c38ecac7cbf60f63fe6981607011ad"
          npm run build:recipes
          npm run update:normalization-snapshot
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import childProcess from "node:child_process";
          import fs from "node:fs";

          const html = fs.readFileSync("index.html", "utf8");
          const current = html.match(/src="js\/app\.js\?v=([^"]+)"/);
          assert.ok(current, "Expected an existing app asset version");
          const previous = current[1].match(/^20260907-(\d+)$/);
          const version = `20260907-${previous ? Number(previous[1]) + 1 : 1}`;
          childProcess.execFileSync("npm", ["run", "set-asset-version", "--", version], { stdio: "inherit" });
          NODE
          npm run report:data-quality

      - name: Confirm the approved recipe and preserve every existing recipe
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import childProcess from "node:child_process";

          const id = "spicy-beef-hot-dogs";
          const source = JSON.parse(fs.readFileSync(`data/recipes/${id}.json`, "utf8"));
          const before = JSON.parse(childProcess.execFileSync("git", ["show", "HEAD:data/recipes.json"], { encoding: "utf8" }));
          const after = JSON.parse(fs.readFileSync("data/recipes.json", "utf8"));
          assert.equal(source.author, "Robert Carr");
          assert.equal(source.instructions.length, 7);
          assert.equal(source.tags.status, "not-tried");
          assert.equal(source.rating, null);
          assert.equal(source.notes.some((note) => /not kitchen-tested|Original recipe developed|No star rating/i.test(note)), false);
          assert.equal(before.some((recipe) => recipe.id === id), false);
          assert.equal(after.length, before.length + 1);
          assert.deepEqual(after.filter((recipe) => recipe.id !== id), before);
          assert.deepEqual(after.find((recipe) => recipe.id === id), source);
          const changed = childProcess.execFileSync("git", ["diff", "--name-only"], { encoding: "utf8" }).trim().split("\n").filter(Boolean);
          const allowed = new Set(["data/recipes.json", "tests/fixtures/normalization_catalog_snapshot.json", "js/grouping.js", "tests/grouping.test.mjs", "index.html", "404.html", "sw.js"]);
          assert.ok(changed.every((path) => allowed.has(path)), `Unexpected changes: ${changed.join(", ")}`);
          console.log(`Verified ${before.length} unchanged recipes and the approved new recipe.`);
          NODE

      - name: Run full core verification
        run: npm run verify

      - name: Show the generated changes for review
        run: |
          git diff --stat
          git diff -- js/grouping.js tests/grouping.test.mjs tests/fixtures/normalization_catalog_snapshot.json index.html 404.html sw.js

      - name: Commit the verified changes to the recipe branch
        shell: bash
        run: |
          set -euo pipefail
          git add data/recipes.json tests/fixtures/normalization_catalog_snapshot.json js/grouping.js tests/grouping.test.mjs index.html 404.html sw.js
          if git diff --cached --quiet; then
            echo "Files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build recipe data and classify hot dog grocery ingredients"
          git push origin HEAD:refs/heads/recipes/spicy-beef-hot-dogs
