name: Prepare oatmeal recipe data

on:
  push:
    branches:
      - feat/oatmeal-with-fruit
    paths:
      - .github/workflows/prepare-oatmeal-data.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify existing recipe baseline
        shell: bash
        run: |
          mv data/recipes/oatmeal-with-fruit.json "$RUNNER_TEMP/oatmeal-with-fruit.json"
          trap 'mv "$RUNNER_TEMP/oatmeal-with-fruit.json" data/recipes/oatmeal-with-fruit.json' EXIT
          npm run verify
      - name: Generate recipe data and review changes
        shell: bash
        run: |
          npm run build:recipes
          npm run update:normalization-snapshot
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import childProcess from 'node:child_process';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const previous = (path) => JSON.parse(childProcess.execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8', maxBuffer: 5 * 1024 * 1024 }));
          const source = read('data/recipes/oatmeal-with-fruit.json');
          const bundle = read('data/recipes.json');
          assert.equal(source.author, 'Robert Carr');
          assert.deepEqual(source.collections, ['breakfast']);
          assert.equal(source.tags.status, 'not-tried');
          assert.equal(source.rating, null);
          assert.equal(source.nutrition, null);
          assert.equal(source.groceryIngredients.length, 4);
          assert.equal(source.groceryIngredients.find((entry) => entry.item === 'ground cinnamon').optional, true);
          assert.deepEqual(bundle.filter((recipe) => recipe.id !== source.id), previous('data/recipes.json'));
          assert.equal(bundle.filter((recipe) => recipe.id === source.id).length, 1);
          assert.deepEqual(bundle.find((recipe) => recipe.id === source.id), source);
          const before = previous('tests/fixtures/normalization_catalog_snapshot.json');
          const after = read('tests/fixtures/normalization_catalog_snapshot.json');
          for (const label of before.labels) {
            assert.deepEqual(after.labels.find((entry) => entry.item === label.item), label);
          }
          assert.deepEqual(after.units, before.units);
          const ingredients = new Set(source.groceryIngredients.map((entry) => entry.item));
          const added = after.labels.filter((entry) => !before.labels.some((old) => old.item === entry.item));
          for (const entry of added) assert.ok(ingredients.has(entry.item), `Unrelated label: ${entry.item}`);
          console.log('Only the new recipe was added; existing recipes, labels, and units are unchanged.');
          console.log('Added grocery labels:', JSON.stringify(added));
          JS
          npm run report:data-quality
          git diff --check
          git diff --stat
          git diff -- tests/fixtures/normalization_catalog_snapshot.json
      - name: Verify generated recipe data
        run: npm run verify
      - name: Commit generated files only
        shell: bash
        run: |
          git add data/recipes.json tests/fixtures/normalization_catalog_snapshot.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Regenerate oatmeal recipe bundle and grocery catalog'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git archive --format=tar -o "$RUNNER_TEMP/oatmeal-checked-source.tar" HEAD
      - name: Make checked source available for local verification
        uses: actions/upload-artifact@v4
        with:
          name: oatmeal-checked-source
          path: ${{ runner.temp }}/oatmeal-checked-source.tar
          retention-days: 1
