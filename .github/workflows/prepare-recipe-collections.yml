name: Prepare recipe collections

on:
  push:
    branches: [feat/health-meal-prep-collections]
    paths: [.github/workflows/prepare-recipe-collections.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: afc9794fd520f20237d3c1c65cce166b54c5e949
      - name: Copy public patch payload for byte comparison
        run: cp .github/workflows/prepare-recipe-collections.yml "$RUNNER_TEMP/patch-transport.yml"
      - uses: actions/upload-artifact@v4
        with:
          name: patch-transport
          path: ${{ runner.temp }}/patch-transport.yml
          retention-days: 1
