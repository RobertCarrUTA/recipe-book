name: Prepare recipe collections

on:
  push:
    branches: [feat/health-meal-prep-collections]
    paths: [.github/workflows/prepare-recipe-collections.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply locally reviewed patch to the exact baseline
        env:
          PATCH_DATA: 
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-recipe-collections.yml
          git add -A
          test "$(git write-tree)" = f08eae7173e0e14a29d00fb54bf1c0348e168833
          printf '%s' "$PATCH_DATA" | base64 --decode | gzip -d > "$RUNNER_TEMP/recipe-collections.patch"
          git apply --check "$RUNNER_TEMP/recipe-collections.patch"
          git apply "$RUNNER_TEMP/recipe-collections.patch"
      - name: Install dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and verify
        run: |
          npm run build:recipes
          npm run set-asset-version -- 20260911-1
          npm run report:data-quality
          npm run verify:full
          git diff --check
      - name: Commit only the verified changes
        run: |
          set -euo pipefail
          git add -A
          test "$(git write-tree)" = 15820e800e3478932764637688b4b84d900a8963
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add scoped health-conscious and meal-prep collections; remove temporary workflow'
          git push origin HEAD:feat/health-meal-prep-collections
