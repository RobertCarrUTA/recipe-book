name: Prepare recipe bundle for issue 154 (temporary)

on:
  push:
    branches:
      - fix/154-explicit-recipe-quantities
    paths:
      - data/recipes/tomato-balsamic-chicken-with-white-beans.json
      - .github/workflows/prepare-recipe-154.yml

permissions:
  contents: write

concurrency:
  group: prepare-recipe-154
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Regenerate recipe bundle
        run: npm run build:recipes
      - name: Confirm this is an instruction-only change
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import childProcess from 'node:child_process';
          import fs from 'node:fs';
          const base = '7a516c20f8d1997d8f176c8915a93da72fb61d8d';
          const id = 'tomato-balsamic-chicken-with-white-beans';
          const sourcePath = `data/recipes/${id}.json`;
          const readBase = (file) => JSON.parse(childProcess.execFileSync('git', ['show', `${base}:${file}`], { encoding: 'utf8', maxBuffer: 5_000_000 }));
          const withoutInstructions = ({ instructions, ...recipe }) => recipe;
          const before = readBase(sourcePath);
          const after = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          assert.deepEqual(withoutInstructions(after), withoutInstructions(before));
          assert.equal(after.instructions.length, before.instructions.length);
          assert.notDeepEqual(after.instructions, before.instructions);
          assert.equal(after.instructions[5], before.instructions[5]);
          const timingTokens = (recipe) => recipe.instructions.map((step) => [...step.matchAll(/\b\d+(?: to \d+)? (?:minutes?|degrees [FC])\b/g)].map((match) => match[0]));
          assert.deepEqual(timingTokens(after), timingTokens(before));
          assert.doesNotMatch(after.instructions.join(' '), /\b(?:remaining|the rest)\b/i);
          const expected = [
            [0, ['1 1/2 lb (680 g)', '1/4 teaspoon fine table salt', '1/2 teaspoon black pepper', '1 tablespoon olive oil', '1 1/2 teaspoons per batch']],
            [1, ['1 tablespoon olive oil', '8 oz (225 g) sliced cremini mushrooms', '1 medium yellow onion (finely diced)', '1/4 teaspoon fine table salt']],
            [2, ['4 garlic cloves (finely chopped)', '2 tablespoons no-salt-added tomato paste', '1 1/2 teaspoons dried oregano', '1/4 teaspoon crushed red pepper (optional)', '2 tablespoons balsamic vinegar', '1 can (28 oz) no-salt-added diced tomatoes', '2 cans (15 oz each), about 3 cups total']],
            [3, ['all of the browned chicken thighs from the plate', 'water 1 tablespoon at a time only if']],
            [4, ['5 oz (142 g) baby spinach', '1 tablespoon balsamic vinegar', '1/4 cup lightly packed fresh basil leaves', 'all of the cooked chicken from the plate']],
          ];
          for (const [index, phrases] of expected) {
            for (const phrase of phrases) assert.ok(after.instructions[index].includes(phrase), `Step ${index + 1} missing: ${phrase}`);
          }
          const oldBundle = readBase('data/recipes.json');
          const newBundle = JSON.parse(fs.readFileSync('data/recipes.json', 'utf8'));
          assert.deepEqual(newBundle.map((recipe) => recipe.id), oldBundle.map((recipe) => recipe.id));
          let changed = 0;
          for (let index = 0; index < newBundle.length; index += 1) {
            if (newBundle[index].id === id) {
              assert.deepEqual(newBundle[index], after);
              assert.deepEqual(withoutInstructions(newBundle[index]), withoutInstructions(oldBundle[index]));
              changed += 1;
            } else {
              assert.deepEqual(newBundle[index], oldBundle[index]);
            }
          }
          assert.equal(changed, 1);
          console.log('PASS: Only the selected recipe instructions changed in source and bundle; ingredient/grocery data, metadata, timing, temperatures, recipe order, and all other recipes are unchanged.');
          JS
      - name: Review advisory data report
        run: npm run report:data-quality
      - name: Run repository verification
        run: npm run verify
      - name: Commit only the generated recipe bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'data/recipes.json'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/recipes.json
          git commit -m 'build(recipes): regenerate bundle for explicit ingredient quantities (#154)'
          git push origin HEAD:fix/154-explicit-recipe-quantities
