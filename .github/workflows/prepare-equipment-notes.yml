name: Prepare equipment notes

on:
  push:
    branches: [feat/chicken-meal-prep-trio]
    paths: [.github/workflows/prepare-equipment-notes.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies and clarify menu labels
        shell: bash
        run: |
          npm ci
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const originals = {
            'orange-ginger-chicken-with-brown-rice': 'bad8193e569ff902d83f2f6bc855c25694c48913',
            'smoky-lemon-chicken-with-brown-rice': 'cecbf598666b632134168888607550dff2a552f5',
          };
          for (const [id, expected] of Object.entries(originals)) {
            const file = path.join('data/recipes', `${id}.json`);
            const bytes = fs.readFileSync(file);
            assert.equal(crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex'), expected);
            const recipe = JSON.parse(bytes);
            const before = 'Use BROWN, not QUICK or the white-basmati setting;';
            assert.ok(recipe.notes.some(note => note.includes(before)));
            recipe.notes = recipe.notes.map(note => note.replace(before, 'Use BROWN, not QUICK or WHITE;'));
            fs.writeFileSync(file, JSON.stringify(recipe, null, 2) + '\n');
          }
          NODE
          npm run build:recipes
          npm run report:data-quality
          npm run verify
      - name: Match reviewed output and commit recipe files
        shell: bash
        run: |
          test "$(git hash-object data/recipes.json)" = c208859b188223a44294d555b6646622bba41e53
          test "$(git hash-object data/recipes/chipotle-lime-chicken-with-sweet-potatoes.json)" = 5d7e34361ad554e40417b47d4c7a3c15e980a382
          test "$(git hash-object data/recipes/orange-ginger-chicken-with-brown-rice.json)" = ca1309991a487a09bbc7de7acd50ced68689337b
          test "$(git hash-object data/recipes/smoky-lemon-chicken-with-brown-rice.json)" = 325559b22e7acd9599d82be0180aca79ac442188
          test "$(git hash-object data/recipes/tomato-balsamic-chicken-with-white-beans.json)" = c9e9c3cf14813715882d6d70828eb5524aa711c0
          test "$(git hash-object tests/fixtures/normalization_catalog_snapshot.json)" = 24581a38d255668532e5cc59c268e2362eb7e791
          git diff --check
          git add data/recipes.json data/recipes/orange-ginger-chicken-with-brown-rice.json data/recipes/smoky-lemon-chicken-with-brown-rice.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use the rice cooker actual BROWN and WHITE menu names'
          git push origin HEAD:refs/heads/feat/chicken-meal-prep-trio
