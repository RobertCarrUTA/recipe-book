name: Prepare equipment notes

on:
  push:
    branches: [feat/chicken-meal-prep-trio]
    paths: [.github/workflows/prepare-equipment-notes.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5a126a87c60b522fa24fbf9e0e7b41358eebb7cf
      - name: Archive the PR baseline
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/recipe-equipment-base.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: recipe-equipment-base
          path: ${{ runner.temp }}/recipe-equipment-base.tar
          retention-days: 1
